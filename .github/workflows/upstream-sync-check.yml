name: Upstream sync check

# Reports drift against the upstream project this fork tracks — never auto-merges.
# WMM customizations live on this branch; a silent auto-merge could clobber them
# without anyone noticing. This workflow only opens/updates a tracking Issue so a
# human decides how (and whether) to pull each upstream change in.
#
# Tracks the LATEST PUBLISHED RELEASE of cheaper-inference/OmniRoute (the project moved
# from diegosouzapw/OmniRoute; the old URL still redirects). A release tag, not a moving
# release/* branch: the branch is unreleased work and was the v3.8.50 pin that stopped
# reporting real drift. Merge with a REAL `git merge <tag>` - never rebase, never `-s ours`
# (see SYNC_UPSTREAM.md).

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wmm-production
          fetch-depth: 0

      - name: Fetch upstream
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/cheaper-inference/OmniRoute/releases/latest --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git remote add upstream https://github.com/cheaper-inference/OmniRoute.git
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/upstream-latest"

      - name: Compute drift
        id: drift
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream-latest)
          AHEAD=$(git rev-list --count upstream-latest..HEAD)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          git log --oneline HEAD..upstream-latest | head -30 > /tmp/commits.txt
          {
            echo "commits<<EOF"
            cat /tmp/commits.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update drift issue
        if: steps.drift.outputs.behind != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const behind = '${{ steps.drift.outputs.behind }}';
            const ahead = '${{ steps.drift.outputs.ahead }}';
            const commits = `${{ steps.drift.outputs.commits }}`;
            const tag = '${{ steps.upstream.outputs.tag }}';
            const title = `Upstream sync: ${behind} commit(s) behind cheaper-inference/OmniRoute@${tag}`;
            const body = [
              `This fork's \`wmm-production\` branch is **${behind}** commit(s) behind`,
              `[\`cheaper-inference/OmniRoute\`@\`${tag}\`](https://github.com/cheaper-inference/OmniRoute/releases/tag/${tag}),`,
              `and carries **${ahead}** commit(s) of WMM-specific changes on top.`,
              '',
              'Newest upstream commits not yet in this branch (most recent first, top 30):',
              '```',
              commits.trim(),
              '```',
              '',
              '**This did not merge anything.** Review the commits above, then do a real',
              '`git merge <tag>` (never rebase, never `-s ours`) and run `npm run check:upstream-drift`.',
              '',
              `_Auto-generated by \`.github/workflows/upstream-sync-check.yml\`, next run: next Monday._`
            ].join('\n');

            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-sync', per_page: 20
            });
            const existing = issues.find(i => i.title.startsWith('Upstream sync:'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['upstream-sync']
              });
            }

      - name: Close drift issue if caught up
        if: steps.drift.outputs.behind == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-sync', per_page: 20
            });
            for (const i of issues.filter(i => i.title.startsWith('Upstream sync:'))) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, body: 'Caught up with upstream — closing.'
              });
            }
